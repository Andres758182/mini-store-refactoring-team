[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-store-refactoring-starter"
version = "0.1.0"
description = "Starter repository for a software design refactoring practice"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["mini_store"]
branch = true
omit = ["tests/*"]